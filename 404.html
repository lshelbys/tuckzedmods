<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tuckzed mods</title>
  <script>
    (function () {
      var pathname = window.location.pathname.replace(/^\/+|\/+$/g, '');
      var search   = window.location.search || '';
      var hash     = window.location.hash || '';

      var routes = {
        'admin':   'admin.html',
        'auth':    'auth.html',
        'login':   'login.html',
        'profile': 'profile.html',
        'mod':     'mod.html'
      };

      if (routes[pathname]) {
        window.location.replace('/' + routes[pathname] + search + hash);
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=7" />
  <style>
    .not-found-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      text-align: center;
    }
    .not-found-card {
      border: 2px solid var(--black);
      border-radius: var(--radius-lg);
      padding: 48px;
      max-width: 480px;
      background: var(--white);
      box-shadow: var(--shadow-lg);
    }
    .not-found-code {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 16px;
    }
    .not-found-sub {
      color: var(--gray-600);
      margin-bottom: 28px;
    }
  </style>
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="tuckzed mods — Game Mod Distribution Platform" />
  <meta property="og:description" content="Download the best mods for Assetto Corsa and BeamNG.drive. Cars, tracks, maps, and physics overhauls curated by the tuckzed mods community." />
  <meta property="og:image" content="https://lshelbys.github.io/tuckzedmods/images/PREVIEW.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <script>if(localStorage.getItem('theme')==='dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
</head>
<body>
  <div class="not-found-wrap">
    <div class="not-found-card">
      <div class="not-found-code">404</div>
      <h2>Page Not Found</h2>
      <p class="not-found-sub">The page you were looking for doesn't exist.</p>
      <a href="./" class="btn btn--primary">Back to Home</a>
    </div>
  </div>
</body>
</html>
