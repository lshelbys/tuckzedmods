<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // Clean URLs (/mod, /admin, …) resolve here on static hosts; forward to the real page.
    (function () {
      var parts = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/').filter(Boolean);
      var last = parts.length ? parts[parts.length - 1] : '';
      var routes = {
        'admin':   'admin.html',
        'auth':    'auth.html',
        'login':   'auth.html',
        'profile': 'profile.html',
        'mod':     'mod.html'
      };
      if (routes[last]) {
        var prefix = parts.length > 1 ? '/' + parts.slice(0, -1).join('/') : '';
        window.location.replace(prefix + '/' + routes[last] + (window.location.search || '') + (window.location.hash || ''));
      }
    })();
  </script>
  <script src="head.js?v=1"></script>
  <title>Page Not Found — tuckzed mods</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=11" />
</head>
<body>
  <main class="not-found-wrap" role="main">
    <div class="not-found-card">
      <div class="not-found-code">404</div>
      <h1>Page Not Found</h1>
      <p class="not-found-sub">The page you were looking for doesn't exist or may have been moved.</p>
      <div class="hero__actions">
        <a href="./" class="btn btn--primary">Back to Home</a>
        <a href="./#mods" class="btn">Browse Mods</a>
      </div>
    </div>
  </main>
</body>
</html>
