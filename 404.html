<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tuckzed mods</title>
  <script>
    (function () {
      var pathname = window.location.pathname.replace(/^\/+|\/+$/g, '');
      var search   = window.location.search || '';
      var hash     = window.location.hash || '';

      var routes = {
        'admin':   'admin.html',
        'auth':    'auth.html',
        'login':   'login.html',
        'profile': 'profile.html',
        'mod':     'mod.html'
      };

      if (routes[pathname]) {
        window.location.replace('/' + routes[pathname] + search + hash);
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .not-found-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      text-align: center;
    }
    .not-found-card {
      border: 2px solid var(--black);
      border-radius: var(--radius-lg);
      padding: 48px;
      max-width: 480px;
      background: var(--white);
      box-shadow: var(--shadow-lg);
    }
    .not-found-code {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 16px;
    }
    .not-found-sub {
      color: var(--gray-600);
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="not-found-wrap">
    <div class="not-found-card">
      <div class="not-found-code">404</div>
      <h2>Page Not Found</h2>
      <p class="not-found-sub">The page you were looking for doesn't exist.</p>
      <a href="./" class="btn btn--primary">Back to Home</a>
    </div>
  </div>
</body>
</html>
